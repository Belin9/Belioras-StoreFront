# Netlify build settings. The /api proxy and SPA fallback are written to
# dist/_redirects by the build (scripts/netlify/vitePluginRedirects.js), from
# API_ORIGIN in .env.production or the site's environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The shopping assistant (netlify/functions/chat.mjs). It needs GEMINI_API_KEY
# in the site's environment variables; GEMINI_MODEL optionally overrides the model.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
