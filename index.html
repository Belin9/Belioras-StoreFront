<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Loaded as a <link> rather than a CSS @import: an @import inside index.css
      cannot start fetching until the stylesheet itself has been downloaded and
      parsed, which delays the display serif past first paint. Bodoni Moda is
      the display serif (its optical sizes keep small headings from going
      hairline-thin); Inter is the body face.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Inter:wght@400;500;600&family=Fira+Code:wght@400&display=swap"
    />

    <!--
      Title, description, canonical, link-preview and structured-data tags.
      scripts/seo/vitePluginSeo.js fills this per page at build; the app
      replaces them on each route change (src/seo/head.js).
    -->
    <!--seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
